apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-server-deployment
  namespace: quick-server
spec:
  replicas: 1
  selector:
    matchlabels:
      app: quick-server
      template:
        metadata:
          labels:
            app: quick-server
  template:
  spec:
    containers:
    - name: quick-server-container
      image: quick-server:latest
      ports:
      - containerPort: 3000
      envFrom:
      - secretRef:
          name: quick-server-secret
